<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Circle (White with clean dark border) -->
  <circle cx="256" cy="256" r="244" fill="#ffffff" stroke="#2c2c2c" stroke-width="14" />

  <!-- Laboratory Flask (Tilted pouring towards book) -->
  <g id="flask" transform="rotate(-38 245 190)">
    <!-- Flask Outline and Body -->
    <path
      d="M 215 90 
         L 215 155 
         C 170 190, 170 250, 215 285 
         C 260 320, 320 320, 365 285 
         C 410 250, 410 190, 365 155 
         L 365 90 
         Z"
      fill="#ffffff"
      stroke="#383838"
      stroke-width="12"
      stroke-linejoin="round"
    />
    <!-- Flask Lip / Flanged Rim -->
    <rect x="205" y="76" width="170" height="18" rx="9" fill="#ffffff" stroke="#383838" stroke-width="12" />
    
    <!-- Liquid inside the tilted flask -->
    <path
      d="M 185 240
         C 220 280, 280 290, 320 280
         C 370 268, 395 240, 395 240
         C 405 260, 385 295, 355 310
         C 315 330, 250 325, 210 295
         C 185 275, 175 255, 185 240
         Z"
      fill="#3a3a3a"
    />
    <!-- Meniscus curved liquid surface -->
    <path
      d="M 185 240 
         Q 280 220 395 240 
         Q 290 270 185 240 Z"
      fill="#2d2d2d"
    />
  </g>

  <!-- Splashes / Droplets pouring from flask -->
  <circle cx="330" cy="265" r="9" fill="#3a3a3a" />
  <circle cx="346" cy="248" r="6" fill="#3a3a3a" />
  <circle cx="338" cy="188" r="7" fill="#3a3a3a" />
  <circle cx="324" cy="172" r="5" fill="#3a3a3a" />
  
  <!-- Splash impact onto open book -->
  <path
    d="M 315 295 
       C 310 280, 318 268, 322 280
       C 328 265, 338 272, 332 288
       C 342 278, 350 286, 342 298
       C 334 308, 320 305, 315 295 Z"
    fill="#3a3a3a"
  />

  <!-- Open Book Beneath Flask -->
  <g id="book">
    <!-- Bottom Cover Base -->
    <path
      d="M 95 372 
         Q 175 366 256 360 
         Q 337 366 417 372 
         L 417 378 
         Q 337 372 256 367 
         Q 175 372 95 378 
         Z"
      fill="#333333"
    />
    <!-- Center Spine Binding Notch -->
    <ellipse cx="256" cy="365" rx="14" ry="7" fill="#ffffff" stroke="#333333" stroke-width="4" />

    <!-- Left Book Pages Fanning -->
    <path
      d="M 250 357 
         Q 170 348 108 362 
         Q 175 338 250 352"
      fill="#333333"
    />
    <path
      d="M 250 347 
         Q 175 330 118 348 
         Q 180 322 250 341"
      fill="#333333"
    />
    <path
      d="M 250 336 
         Q 180 312 132 334 
         Q 188 304 250 328"
      fill="#333333"
    />
    <path
      d="M 250 323 
         Q 188 296 148 318 
         Q 196 288 250 315"
      fill="#333333"
    />
    <path
      d="M 250 310 
         Q 196 280 165 304 
         Q 208 272 250 302"
      fill="#333333"
    />

    <!-- Right Book Pages Fanning -->
    <path
      d="M 262 357 
         Q 342 348 404 362 
         Q 337 338 262 352"
      fill="#333333"
    />
    <path
      d="M 262 347 
         Q 337 330 394 348 
         Q 332 322 262 341"
      fill="#333333"
    />
    <path
      d="M 262 336 
         Q 332 312 380 334 
         Q 324 304 262 328"
      fill="#333333"
    />
    <path
      d="M 262 323 
         Q 324 296 364 318 
         Q 316 288 262 315"
      fill="#333333"
    />
    <path
      d="M 262 310 
         Q 316 280 347 304 
         Q 304 272 262 302"
      fill="#333333"
    />
  </g>
</svg>
